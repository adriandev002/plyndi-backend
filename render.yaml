services:
  - type: web
    name: plyndi-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: CLIENT_SHARED_KEY
        sync: false
      - key: RATE_LIMIT_MAX
        value: "60"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "60"
      - key: SYNC_STORAGE_DIR
        value: "/var/data/plyndi/backups"
      - key: SYNC_MAX_VERSIONS
        value: "10"
      - key: SYNC_MAX_SCHEMA_VERSION
        value: "1"
      - key: SYNC_JWT_SECRET
        sync: false
      - key: SYNC_REQUIRE_VERIFIED_IDENTITY
        value: "true"
      # Phase 3-A credits + spend cap (see README.md's "AI credits, per-device identity + global
      # spend cap" section for the manual Render Postgres provisioning steps this Blueprint
      # deliberately does NOT automate — a `databases:` block here would auto-create a billed
      # Postgres instance on every blueprint sync with no chance to pick plan/region first).
      - key: DATABASE_URL
        sync: false
      - key: AI_JWT_SECRET
        sync: false
      - key: AI_REQUIRE_VERIFIED_IDENTITY
        value: "false"
      - key: AI_MONTHLY_CREDIT_ALLOWANCE
        value: "15"
      # Phase 3-B: per-plan allowances. FREE falls back to AI_MONTHLY_CREDIT_ALLOWANCE when
      # unset, so existing deploys keep their behaviour with no config change. PREMIUM is
      # granted only for a server-verified StoreKit 2 entitlement
      # (POST /v1/ai/entitlement/verify) — never from a client claim.
      - key: AI_FREE_MONTHLY_ALLOWANCE
        value: "15"
      - key: AI_PREMIUM_MONTHLY_ALLOWANCE
        value: "300"
      - key: AI_CREDITS_ENFORCE
        value: "false"
      - key: AI_DAILY_CREDIT_CAP
        value: "2000"
      # Explore feed (Phase 2). PUBLIC_BASE_URL left sync:false — set it to this service's real
      # Render URL once known (e.g. https://plyndi-backend.onrender.com); unset is safe too, it
      # falls back to deriving the origin from each request (see src/routes/content.js).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CONTENT_TTL_SECONDS
        value: "900"
      # Required for /v1/admin/* (the separate Phase 3 admin app) to work at all — unset leaves
      # every admin route returning 503 (see src/routes/admin.js).
      - key: ADMIN_TOKEN
        sync: false
